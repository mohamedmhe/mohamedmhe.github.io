Q.forEach(function(q,i){q.id=i; if(q.t==="vf"){q.o=["Vrai","Faux"];q.fix=1;} if(q.a===undefined&&!q.t)q.a=0;});

// ===== ÉTAT =====
var KEY="rev-emc-democratie";
var st={m:{},e:{},best:null,fb:[]};
try{var s=localStorage.getItem(KEY);if(s)st=JSON.parse(s);}catch(e){}
if(!st.fb)st.fb=[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
function saveRun(){try{if(run)localStorage.setItem(KEY+"-run",JSON.stringify({mode:run.mode,ids:run.list.map(function(q){return q.id;}),i:run.i,score:run.score,wrong:run.wrong.map(function(q){return q.id;}),tried:run.tried}));else localStorage.removeItem(KEY+"-run");}catch(e){}}
function loadRun(){try{var r=JSON.parse(localStorage.getItem(KEY+"-run")||"null");if(!r||r.i>=r.ids.length)return null;return r;}catch(e){return null;}}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
var app=document.getElementById("app");
var run=null;

// ===== RETOURS (base partagée si dispo, sinon téléphone) =====
var DB=null,dbFb=[],dbOk=false;
(async function(){try{if(!window.claude||!window.claude.use)return;DB=await window.claude.use("db");if(!DB)return;
 DB.collection("retours").onSnapshot(function(snap){dbOk=true;dbFb=[];snap.forEach(function(d){var x=d.data();x._id=d.id;dbFb.push(x);});if(!run)home();},function(){DB=null;});}catch(e){DB=null;}})();
function allFb(){var l=dbFb.slice();st.fb.forEach(function(f){if(!f.synced)l.push(f);});return l.sort(function(a,b){return (b.date||"").localeCompare(a.date||"");});}
async function sendFb(f){
 if(DB){try{await DB.collection("retours").doc("r"+Date.now()+Math.floor(Math.random()*1000)).set(f);return true;}catch(e){}}
 st.fb.push(f);save();return false;
}
var FBT=["La réponse est fausse","La question n'est pas claire","Pas dans mon cours","Il manque une réponse","Autre remarque"];
function openFb(){

 var h='<div class="card" style="background:#f8f9fc;margin-top:12px"><b>💬 Ton retour sur cette question</b><div style="margin:8px 0">';
 FBT.forEach(function(t,i){h+='<label style="display:block;margin:6px 0;font-size:15px"><input type="radio" name="fbt" value="'+i+'"'+(i===0?' checked':'')+'> '+t+'</label>';});
 h+='</div><textarea id="fbtxt" rows="3" placeholder="Explique (facultatif) : quelle est la bonne réponse selon toi, ce qui n\'est pas clair..." style="width:100%;font-size:16px;padding:10px;border-radius:10px;border:2px solid #d0d6e2;font-family:inherit"></textarea>';
 h+='<div class="row"><button class="btn main" onclick="submitFb()">Envoyer</button><button class="btn" onclick="document.getElementById(\'fbbox\').innerHTML=\'\'">Annuler</button></div></div>';
 box.innerHTML=h;box.scrollIntoView({behavior:"smooth",block:"nearest"});
}
async function submitFb(){
 var q=run.list[run.i];var t=document.querySelector('input[name=fbt]:checked');
 var f={qid:q.id,partie:CH[q.c],question:q.q,bonneReponse:goodText(q),type:FBT[t?+t.value:4],texte:(document.getElementById("fbtxt").value||"").trim(),date:new Date().toISOString()};
 var box=document.getElementById("fbbox");box.innerHTML='<div class="fb ok">Envoi...</div>';
 var shared=await sendFb(f);
 box.innerHTML='<div class="fb ok">✅ Merci, retour enregistré'+(shared?'':' sur ce téléphone')+'. La question continue normalement.</div>';
}
function fbPage(){
 var l=allFb();
 var h='<div class="top"><button class="link" onclick="home()">← Accueil</button></div><h1>💬 Mes retours ('+l.length+')</h1>';
 if(!l.length)h+='<div class="card">Aucun retour pour l\'instant. Pendant une question, appuie sur « 💬 Faire un retour ».</div>';
 l.forEach(function(f){h+='<div class="wrong" style="border-left-color:#3b5bdb"><b style="color:#2b3f9e">'+esc(f.type)+'</b> · '+esc(f.partie||"")+'<br>'+esc(f.question)+'<br><span class="sub">Réponse de l\'appli : '+esc(f.bonneReponse)+'</span>'+(f.texte?'<br>📝 '+esc(f.texte):'')+'</div>';});
 if(l.length)h+='<button class="btn alt" style="text-align:center" onclick="copyFb()">📋 Copier tous mes retours</button><div id="cpy" class="center sub"></div>';

 try{navigator.clipboard.writeText(txt).then(function(){document.getElementById("cpy").textContent="Copié ✅";},function(){document.getElementById("cpy").textContent="Copie impossible ici.";});}catch(e){document.getElementById("cpy").textContent="Copie impossible ici.";}

function home(){
 run=null;
 var n=Q.length,m=Object.keys(st.m).length,e=Object.keys(st.e).length,pct=Math.round(m/n*100);
 var h='<h1>🇫🇷 EMC : les règles du jeu démocratique</h1><div class="sub">Révision EMC, 3e. Objectif : 20/20 💪</div>';
 h+='<div class="card"><b>Maîtrise du cours : '+pct+' %</b><div class="bar"><div style="width:'+pct+'%"></div></div><div class="sub" style="margin:0">'+m+' questions réussies sur '+n+(st.best!==null?' · Meilleure note à l\'examen blanc : <b>'+st.best+'/20</b>':'')+'</div></div>';
 var r=loadRun();
 if(r)h+='<button class="btn red" onclick="resume()">▶️ Reprendre ma série en cours<small>Il reste '+(r.ids.length-r.i)+' question(s) à valider</small></button>';
 h+='<div class="note">🔁 Règle : une question ratée revient à la fin de la série. On ne termine que quand <b>tout</b> est juste.</div>';
 h+='<button class="btn main" onclick="start(\'exam\')">🎯 Examen blanc<small>20 questions sur tout le chapitre, note sur 20 (1er essai)</small></button>';
 h+='<button class="btn alt" onclick="start(\'all\')">📚 Tout le cours<small>Les '+n+' questions, dans le désordre</small></button>';
 if(e)h+='<button class="btn red" onclick="start(\'err\')">❌ Refaire mes erreurs ('+e+')<small>Jusqu\'à ce qu\'il n\'en reste plus aucune</small></button>';
 h+='<button class="btn" onclick="start(\'new\')">⭐ Questions pas encore réussies ('+(n-m)+')</button>';
 h+='<h2>Par partie</h2>';
 Object.keys(CH).forEach(function(k){var tot=Q.filter(function(q){return q.c===k;}),ok=tot.filter(function(q){return st.m[q.id];}).length;
  h+='<button class="btn" onclick="start(\'ch\',\''+k+'\')">'+CH[k]+'<small>'+ok+' / '+tot.length+' réussies</small></button>';});
 h+='<h2>Le cours</h2><button class="btn" onclick="fiche()">📖 Fiche de révision complète</button>';
 h+='<button class="btn" onclick="fbPage()">💬 Mes retours sur les questions ('+allFb().length+')</button>';
 h+='<div class="center"><button class="link" onclick="resetAll()">Remettre à zéro ma progression</button></div>';
 app.innerHTML=h;window.scrollTo(0,0);
}
function resetAll(){
 app.innerHTML='<div class="card center"><p><b>Effacer toute ta progression ?</b><br><span class="sub">Tes retours sont gardés.</span></p><div class="row"><button class="btn red" onclick="st={m:{},e:{},best:null,fb:st.fb};save();run=null;saveRun();home()">Oui, effacer</button><button class="btn" onclick="home()">Annuler</button></div></div>';
}
function start(mode,ch){
 var l=Q;
 if(mode==="err")l=Q.filter(function(q){return st.e[q.id];});
 if(mode==="new")l=Q.filter(function(q){return !st.m[q.id];});
 if(mode==="ch")l=Q.filter(function(q){return q.c===ch;});
 l=shuf(l);
 if(mode==="exam"){
  var by={};l.forEach(function(q){(by[q.c]=by[q.c]||[]).push(q);});
  var want={rep:3,pou:4,txt:3,qpc:2,loi:3,enq:2,lai:1,eu:2},pick=[];
  Object.keys(want).forEach(function(k){pick=pick.concat((by[k]||[]).slice(0,want[k]));});
  l=shuf(pick);
 }
 if(!l.length){app.innerHTML='<div class="card center"><p>🎉 Rien à réviser ici, tout est réussi !</p><button class="btn main" onclick="home()">Retour</button></div>';return;}
 run={mode:mode,list:l,i:0,score:0,wrong:[],tried:{}};
 saveRun();show();
}
function resume(){
 var r=loadRun();if(!r){home();return;}
 run={mode:r.mode,list:r.ids.map(function(id){return Q[id];}).filter(Boolean),i:r.i,score:r.score,wrong:r.wrong.map(function(id){return Q[id];}).filter(Boolean),tried:r.tried||{}};
 show();
}
function quitAsk(){
 var left=run.list.length-run.i;
 document.getElementById("quitbox").innerHTML='<div class="card" style="background:#fff5f5"><b>✋ Pas si vite !</b><p style="margin:6px 0">Il reste <b>'+left+'</b> question(s) à valider. Ta série est gardée : tu pourras la reprendre depuis l\'accueil.</p><div class="row"><button class="btn main" onclick="document.getElementById(\'quitbox\').innerHTML=\'\'">Je continue 💪</button><button class="btn" onclick="saveRun();home()">Faire une pause</button></div></div>';
}
function show(){
 var q=run.list[run.i];run.done=false;
 var unique=Object.keys(run.tried).length,first=!run.tried[q.id];
 var left=run.list.length-run.i;
 var h='<div class="top"><button class="link" onclick="quitAsk()">⏸ Pause</button><span>Reste à valider : <b>'+left+'</b> · ✅ '+run.score+'</span></div>';
 h+='<div id="quitbox"></div>';
 h+='<div class="bar"><div style="width:'+(run.i/run.list.length*100)+'%"></div></div>';
 h+='<div class="card"><span class="tag">'+CH[q.c]+'</span>'+(first?'':' <span class="tag" style="background:#ffe3e3;color:#a61e1e">🔁 Ratée tout à l\'heure, à revalider</span>')+'<div class="q">'+esc(q.q)+'</div>';
 if(q.t==="txt"){
  h+='<div class="sub" style="margin:4px 0 10px">✍️ Écris la réponse (les accents ne comptent pas)</div><input type="text" id="inp" autocomplete="off" autocapitalize="off"><button class="btn main" style="text-align:center" onclick="checkTxt()">Valider</button>';
 }else{
  var opts;
  if(q.pool){var others=shuf(q.pool.map(function(_,i){return i;}).filter(function(i){return i!==q.a;})).slice(0,3);opts=shuf([q.a].concat(others));run.cur=opts.map(function(i){return {txt:q.pool[i],ok:i===q.a};});}
  else{opts=q.o.map(function(t,i){return {txt:t,ok:i===q.a};});run.cur=q.fix?opts:shuf(opts);}
  run.cur.forEach(function(o,i){h+='<button class="opt" id="o'+i+'" onclick="pick('+i+')">'+esc(o.txt)+'</button>';});
 }
 h+='<div id="fb"></div><div class="center"><button class="link" onclick="openFb()">💬 Faire un retour sur cette question</button></div><div id="fbbox"></div></div>';
 app.innerHTML=h;window.scrollTo(0,0);
 var inp=document.getElementById("inp");if(inp){inp.focus();inp.addEventListener("keydown",function(ev){if(ev.key==="Enter")checkTxt();});}
}
function goodText(q){return q.t==="txt"?q.r:(q.pool?q.pool[q.a]:q.o[q.a]);}
function pick(i){
 if(run.done)return;run.done=true;
 var ok=run.cur[i].ok;
 run.cur.forEach(function(o,j){var b=document.getElementById("o"+j);b.disabled=true;if(o.ok)b.classList.add("ok");else if(j===i)b.classList.add("ko");});
 result(ok);
}
function checkTxt(){
 if(run.done)return;var q=run.list[run.i];var v=norm(document.getElementById("inp").value);
 if(!v)return;run.done=true;document.getElementById("inp").disabled=true;
 var ok=q.acc.some(function(a){return a.split("+").every(function(k){return v.indexOf(norm(k))>=0;});});
 result(ok,true);
}
function result(ok,txt){
 var q=run.list[run.i];var first=!run.tried[q.id];run.tried[q.id]=1;run.lastFirst=first;
 record(q.id,ok);
 if(ok){if(first)run.score++;}
 else{if(first)run.wrong.push(q);run.list.push(q);}
 saveRun();
 var h='<div class="fb '+(ok?'ok':'ko')+'">'+(ok?'✅ <b>Bravo !</b>':'❌ <b>Pas tout à fait.</b>')+(!ok||txt?' Réponse : <b>'+esc(goodText(q))+'</b>':'')+(q.e?'<br>'+esc(q.e):'')+(ok?'':'<br>🔁 Cette question reviendra à la fin.')+'</div>';
 if(!ok&&txt)h+='<button class="link" onclick="override()">J\'avais écrit la même chose avec d\'autres mots : compter juste</button>';
 h+='<button class="btn main" style="text-align:center;margin-top:12px" onclick="next()">'+(run.i+1<run.list.length?'Question suivante →':'Voir mon résultat')+'</button>';
 document.getElementById("fb").innerHTML=h;
 document.getElementById("fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function override(){var q=run.list[run.i];record(q.id,true);
 if(run.lastFirst){run.score++;run.wrong.pop();}
 run.list.pop();saveRun();
 var f=document.getElementById("fb");f.querySelector(".fb").className="fb ok";f.querySelector(".fb").innerHTML='✅ <b>Compté juste.</b> Réponse : <b>'+esc(goodText(q))+'</b>';
 var l=f.querySelector(".link");if(l)l.remove();
 var b=f.querySelector(".btn");if(b)b.textContent=(run.i+1<run.list.length?'Question suivante →':'Voir mon résultat');}
function record(id,ok){if(ok){st.m[id]=1;delete st.e[id];}else{delete st.m[id];st.e[id]=1;}save();}
function next(){run.i++;saveRun();if(run.i<run.list.length)show();else end();}
function end(){
 var n=Object.keys(run.tried).length,s=run.score,note=Math.round(s/n*20*2)/2;
 if(run.mode==="exam"&&(st.best===null||note>st.best)){st.best=note;save();}
 var wrong=run.wrong;run.done=true;var mode=run.mode;run=null;saveRun();
 var msg=note>=20?"🏆 PARFAIT du premier coup !":note>=16?"🔥 Très bien ! Toutes les questions sont maintenant validées.":note>=12?"👍 Bien : tout est validé, mais refais une série pour l'avoir du premier coup.":"💪 Tout est validé au final. Relis la fiche et recommence pour faire mieux du premier coup.";
 var h='<div class="card center"><div class="sub" style="margin:0">Ta note (au premier essai)</div><div class="big">'+note+'/20</div><div>'+s+' juste(s) du premier coup sur '+n+'</div><p>✅ <b>Toutes les questions ont été validées.</b></p><p><b>'+msg+'</b></p></div>';
 if(wrong.length){h+='<h2>Ratées au 1er essai ('+wrong.length+')</h2>';wrong.forEach(function(q){h+='<div class="wrong">'+esc(q.q)+'<br>→ <b>'+esc(goodText(q))+'</b></div>';});}
 h+='<button class="btn main" style="text-align:center" onclick="start(\'exam\')">Nouvel examen blanc</button><button class="btn" style="text-align:center" onclick="home()">Accueil</button>';
 app.innerHTML=h;window.scrollTo(0,0);
}
function fiche(){
 var h='<div class="top"><button class="link" onclick="home()">← Accueil</button></div><div class="card fiche"><h1>📖 Fiche de révision</h1>';
 h+='<h3>1. Définitions</h3><ul>';
 h+='<li><b>Démocratie</b> : c\'est <b>le peuple qui gouverne</b>.</li>';
 h+='<li><b>Constitution</b> : texte qui <b>fixe l\'organisation des pouvoirs</b>. Celle de la <b>Ve République</b> a été adoptée en <b>1958</b>.</li>';
 h+='<li><b>République</b> : régime politique où le dirigeant est <b>élu par le peuple</b> et gouverne <b>au nom du peuple</b>.</li>';
 h+='<li>La Constitution est <b>la règle la plus importante</b> : toutes les autres lois doivent la respecter. Elle garantit les droits et libertés (liberté d\'expression, égalité devant la loi, droit de vote) et <b>répartit les pouvoirs</b> pour éviter qu\'une seule personne décide de tout.</li></ul>';
 h+='<h3>2. Les 3 pouvoirs</h3><table><tr><th>Pouvoir</th><th>Qui ?</th><th>Rôle</th></tr><tr><td><b>Exécutif</b></td><td>Président + Gouvernement</td><td>Dirige le pays, fait appliquer les lois</td></tr><tr><td><b>Législatif</b></td><td>Parlement = Assemblée nationale + Sénat</td><td>Vote les lois et le budget de l\'État</td></tr><tr><td><b>Judiciaire</b></td><td>Les juges</td><td>Juge en fonction des lois</td></tr></table><ul>';
 h+='<li><b>Président</b> : suffrage universel <b>direct, 5 ans</b>. Chef de l\'État, nomme le Premier ministre, veille au respect de la Constitution, représente la France, <b>chef des armées</b>, peut <b>dissoudre l\'Assemblée</b>.</li>';
 h+='<li><b>Gouvernement</b> : dirigé par le <b>Premier ministre</b>. Conduit la politique de la Nation, prépare les projets de loi, fait appliquer les lois, dirige l\'administration. Ministres nommés par le Président <b>sur proposition du Premier ministre</b>.</li>';
 h+='<li><b>Assemblée nationale</b> : députés élus au suffrage universel <b>direct, 5 ans</b>. Vote les lois, contrôle le Gouvernement, peut le renverser par une <b>motion de censure</b>. <b>Dernier mot</b> en cas de désaccord.</li>';
 h+='<li><b>Sénat</b> : sénateurs élus au suffrage universel <b>indirect, 6 ans</b>, renouvelés <b>par moitié tous les 3 ans</b>. Représente les <b>collectivités territoriales</b> (commune, département, région).</li>';
 h+='<li><b>Judiciaire</b> : fait respecter le droit, juge en cas de conflit ou d\'infraction. Juges <b>indépendants</b>. Affaires <b>civiles et pénales</b>.</li></ul>';
 h+='<p><b>Autres institutions</b></p><ul><li><b>Conseil constitutionnel</b> : vérifie que les lois respectent la Constitution, contrôle certaines élections nationales.</li><li><b>Conseil d\'État</b> : conseille le Gouvernement sur les projets de loi, juridiction suprême de l\'ordre <b>administratif</b>.</li><li><b>Cour des comptes</b> : contrôle l\'utilisation de <b>l\'argent public</b>.</li><li><b>Cour de cassation</b> : juridiction suprême de l\'ordre <b>judiciaire</b>.</li></ul>';
 h+='<h3>3. Les textes fondamentaux (bloc de constitutionnalité)</h3><table><tr><th>Texte</th><th>Ce qu\'il garantit</th></tr>';
 h+='<tr><td><b>DDHC</b>, 26 août <b>1789</b></td><td>Égalités et libertés. Art. 1 : libres et égaux en droits. Art. 3 : souveraineté dans la Nation. Art. 4 : liberté = tout ce qui ne nuit pas à autrui, bornes fixées par la loi. Art. 11 : libre communication des pensées et opinions.</td></tr>';
 h+='<tr><td><b>Préambule de 1946</b> (IVe Rép.)</td><td>Droits sociaux : égalité, droit d\'asile, droit de grève. Al. 11 : santé, sécurité matérielle, repos, loisirs ; moyens d\'existence pour qui ne peut travailler. Al. 13 : égal accès à l\'instruction.</td></tr>';
 h+='<tr><td><b>Constitution de 1958</b></td><td>Préambule : attachement à 1789, 1946 et 2004. Art. 66 : nul ne peut être arbitrairement détenu ; l\'autorité judiciaire, gardienne de la liberté individuelle.</td></tr>';
 h+='<tr><td><b>Charte de l\'environnement 2004</b></td><td>Art. 1 : droit à un environnement équilibré et sain. Art. 2 : devoir de le préserver et l\'améliorer.</td></tr></table>';
 h+='<div class="note">💡 Préambule = introduction.</div>';
 h+='<h3>4. La QPC (fiche 57)</h3><ul><li><b>Question Prioritaire de Constitutionnalité</b> : droit pour toute personne de soutenir, <b>lors d\'un procès</b>, qu\'une loi est contraire aux droits et libertés garantis par la Constitution.</li>';
 h+='<li>Parcours : <b>juge</b> (si question nouvelle et sérieuse) → <b>Cour de cassation</b> (ou <b>Conseil d\'État</b>), 3 mois → <b>Conseil constitutionnel</b>, 3 mois. Si la loi est contraire : il peut la <b>supprimer</b> ou décider qu\'elle ne sera plus appliquée.</li>';
 h+='<li>Déposer une QPC <b>suspend le procès</b>.</li><li>Montre que l\'autorité judiciaire est <b>indépendante</b> (pas d\'ordres du gouvernement) et que même une loi votée peut être corrigée.</li>';
 h+='<li><b>Exemple</b> : des <b>associations de défense de l\'environnement</b> attaquent une <b>entreprise d\'engrais</b> (résidus dans un lac) devant le <b>tribunal correctionnel</b>, avec une loi de 2018. L\'entreprise invoque la <b>liberté d\'entreprendre</b> (DDHC 1789) et dépose une QPC. Le Conseil constitutionnel, avec la <b>Charte de l\'environnement de 2004</b>, juge que l\'environnement, <b>patrimoine commun</b> des êtres humains, est un <b>objectif de valeur constitutionnelle</b> qui peut limiter la liberté d\'entreprendre.</li></ul>';
 h+='<h3>5. Le parcours d\'une loi (fiche 58)</h3><ul><li><b>Loi</b> : règle votée par le Parlement, qui organise la vie en société et respecte la Constitution.</li>';
