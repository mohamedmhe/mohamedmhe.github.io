 h+='<h3>V. Fiche prof : qu\'est-ce que l\'entreprise</h3><ul>';
 h+='<li><b>Entreprise</b> : l\'activité d\'une personne ou d\'un groupe de personnes qui travaillent pour fournir des biens ou des services à des clients.</li>';
 h+='<li>En France : <b>plus de 2 millions</b> d\'entreprises, <b>14 millions</b> de salariés.</li>';

 h+='<li>Le plus courant : la <b>micro-entreprise (TPE), 92,9 %</b> (coiffure, serrurier, cordonnier, artisan).</li>';

 h+='<li><b>Patrick Turet</b> : ne trouve pas de fournisseurs compétitifs pour lui fournir des roues de qualité.</li>';
 h+='<li><b>5 étapes d\'un projet</b> : 1. étude du projet, 2. définition du projet, 3. mise en place du projet, 4. production et lancement, 5. vente et développement.</li>';
